spring.application.name=Coffe
# === DataSource (подключение к PostgreSQL) ===
spring.datasource.url=jdbc:postgresql://localhost:5432/cafe_db
spring.datasource.username=cafe_user
spring.datasource.password=cafe_password
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === Flyway (миграции) ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
